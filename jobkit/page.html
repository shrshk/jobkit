<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Jobs</title>
<style>
  :root { --bg: #f6f6f7; --card: #fff; --text: #1b1b1f; --mute: #6b6b74; --line: #e3e3e8;
          --ok: #1f8a4c; --bad: #c62828; --warn: #b26a00; --run: #1565c0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1c1c21; --text: #ececf1; --mute: #9a9aa6; --line: #2c2c33;
            --ok: #4cc27f; --bad: #ef5350; --warn: #ffb74d; --run: #64b5f6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  header a { color: var(--mute); font-size: 14px; }
  .note { color: var(--mute); font-size: 13px; margin: 4px 0 16px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
         display: flex; gap: 12px; align-items: flex-start; }
  .body { flex: 1; min-width: 0; }
  .what { font-weight: 600; }
  .meta { color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
  .err { color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
  .warnline { color: var(--warn); font-size: 13px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .ok { color: var(--ok); } .failing { color: var(--bad); } .interrupted { color: var(--warn); }
  .running { color: var(--run); } .never, .paused { color: var(--mute); }
  .empty { color: var(--mute); }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .acts { display: flex; gap: 6px; }
  .acts button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--text); cursor: pointer; }
  .acts button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <header><h1>Jobs</h1><a href="./">← {{TITLE}}</a></header>
  <p class="note" id="note">Loading…</p>
  <div id="jobs"></div>
</main>
<script>
const LABEL = { ok: "OK", failing: "Failing", interrupted: "Interrupted", running: "Running", never: "Not run yet", paused: "Paused" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const when = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "never";

function state(job) {
  if (job.running) return "running";
  if (!job.last) return job.paused ? "paused" : "never";
  if (job.last.status === "interrupted") return "interrupted";
  if (job.failures_in_a_row > 0) return "failing";
  return job.paused ? "paused" : "ok";
}

function card(job) {
  const s = state(job), last = job.last;
  const chip = s === "failing" && job.failures_in_a_row > 1 ? `Failing ×${job.failures_in_a_row}` : LABEL[s];
  let extra = "";
  if (s === "failing") extra = `<div class="err">${esc(last.error || "failed")} · last OK ${esc(when(job.last_ok))}</div>`;
  if (s === "interrupted") extra = `<div class="warnline">Stopped before finishing (the Mac restarted or the job was killed) · last OK ${esc(when(job.last_ok))}</div>`;
  return `<div class="job"><div class="body">
      <div class="what">${esc(job.description || job.name)}</div>
      <div class="meta">${esc(job.schedule || "no schedule")} · last run ${esc(when(last && last.started))}${last && last.summary ? " · " + esc(last.summary) : ""}</div>
      ${extra}</div><div class="side"><span class="chip ${s}">${esc(chip)}</span>${buttons(job)}</div></div>`;
}

// Run now and Pause / Resume, where the app offers them (job.actions); Run now waits while a job is paused.
function buttons(job) {
  const a = job.actions || {}, name = esc(job.name);
  let html = "";
  if (a.run && !job.paused) html += `<button data-run="${name}" ${job.running ? "disabled" : ""}>Run now</button>`;
  if (a.pause) html += `<button data-pause="${name}" data-to="${job.paused ? 0 : 1}">${job.paused ? "Resume" : "Pause"}</button>`;
  return html ? `<div class="acts">${html}</div>` : "";
}
async function act(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!res.ok) document.getElementById("note").textContent = `That did not work (HTTP ${res.status}).`;
  else load();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  b.disabled = true;
  if (b.dataset.run) act(`api/jobs/${encodeURIComponent(b.dataset.run)}/run`);
  if (b.dataset.pause) act(`api/jobs/${encodeURIComponent(b.dataset.pause)}/pause`, { paused: b.dataset.to === "1" });
});

async function load() {
  const note = document.getElementById("note");
  try {
    const res = await fetch("api/jobs", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { jobs } = await res.json();
    document.getElementById("jobs").innerHTML = jobs.length ? jobs.map(card).join("") : `<p class="empty">No scheduled jobs.</p>`;
    const bad = jobs.filter((j) => ["failing", "interrupted"].includes(state(j))).length;
    note.textContent = `${jobs.length} job${jobs.length === 1 ? "" : "s"}${bad ? ` · ${bad} need${bad === 1 ? "s" : ""} a look` : ""} · updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    note.textContent = `Could not load jobs (${e.message}); trying again shortly.`;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
